<!doctype html>
<html class="page" lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="css/index.css" />
		<link
			rel="shortcut icon"
			href="./icons/fitness-favicon-icon.svg"
			type="image/x-icon"
		/>
		<script src="./js/index.js" type="module"></script>
		<title>Pulse Fitness Center</title>
	</head>
	<body class="page__body">
		<header class="header">
			<div class="container">
				<div class="header__inner">
					<div class="header__container">
						<a class="logo header__logo" href="/">
							<img
								class="header__logo-img"
								width="198"
								height="38"
								src="./icons/logo-icon.svg"
								alt="Логотип Pulse fitness center"
							/>
						</a>
						<nav
							class="header__menu"
							aria-label="Главное меню"
							id="header__menu"
						>
							<ul class="header__menu-list">
								<li class="header__menu-item">
									<a class="header__menu-link" href="/">Home</a>
								</li>
								<li class="header__menu-item">
									<a class="header__menu-link" href="#">Catalogs</a>
								</li>
								<li class="header__menu-item">
									<a class="header__menu-link" href="#">Blog</a>
								</li>
								<li class="header__menu-item">
									<a class="header__menu-link" href="#">Collections</a>
								</li>
								<li class="header__menu-item">
									<a class="header__menu-link" href="#">Contact us</a>
								</li>
							</ul>
						</nav>
						<div class="header__actions">
							<button
								class="header__actions-button"
								title="Корзина"
								aria-label="Корзина"
							>
								<svg width="44" height="34">
									<use
										class="header__actions-icon"
										href="./icons/header-sprite.svg#cart"
									></use>
								</svg>
							</button>
							<button
								class="header__actions-button"
								title="Поиск"
								aria-label="Поиск"
							>
								<svg width="29" height="29">
									<use
										class="header__actions-icon"
										href="./icons/header-sprite.svg#search"
									></use>
								</svg>
							</button>
							<button
								class="header__burger burger"
								aria-label="Открыть меню"
								aria-expanded="false"
								aria-controls="header__menu"
							>
								<svg width="25" height="22">
									<use
										class="burger__icon-menu"
										href="./icons/header-sprite.svg#burger"
									></use>
									<use
										class="burger__icon-cross"
										href="./icons/header-sprite.svg#cross"
									></use>
								</svg>
							</button>
						</div>
					</div>
				</div>
			</div>
		</header>
	</body>
</html>
